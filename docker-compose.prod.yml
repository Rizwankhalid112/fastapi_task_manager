# Production-style stack: baked images, no source bind mounts, no hot reload.
# Usage from project root: docker compose -f docker-compose.prod.yml up --build

services:
  db:
    image: postgres:15-alpine
    container_name: taskflow_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: rizwan
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizwan -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: taskflow_backend_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rizwan:secret123@db:5432/taskflow
      SECRET_KEY: ${BACKEND_SECRET_KEY:-your_secret_key_at_least_32_characters_long}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: taskflow_frontend_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data_prod:
